<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="racpdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="sombrasSuaves" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo redondeado estilo app icon moderno -->
  <rect width="512" height="512" rx="128" fill="url(#racpdGradient)" />

  <!-- Círculo interior de contraste suave -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.15" />

  <!-- Símbolo de Salud / Red de Apoyo (Cruz médica redondeada con corazón de cuidado) -->
  <g filter="url(#sombrasSuaves)">
    <!-- Cruz médica estilizada en blanco puro -->
    <rect x="220" y="140" width="72" height="232" rx="36" fill="#ffffff" />
    <rect x="140" y="220" width="232" height="72" rx="36" fill="#ffffff" />

    <!-- Centro con detalle azul médico -->
    <circle cx="256" cy="256" r="28" fill="#0284c7" />
  </g>
</svg>
